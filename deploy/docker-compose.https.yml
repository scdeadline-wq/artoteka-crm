# Надстройка над docker-compose.vps.yml: nginx + Let's Encrypt.
# Подключается автоматически (update.sh / rollback.sh), если в deploy/.env задан DOMAIN.
# Первичное включение и выпуск сертификата: ./deploy/https-setup.sh <домен>
#
# Нужен Docker Compose >= 2.24 (тег !reset).
services:
  frontend:
    # Порт 80 теперь у nginx; фронт доступен только изнутри сети compose
    ports: !reset []

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      LEGACY_DOMAINS: ${LEGACY_DOMAINS:-legacy.invalid}
    volumes:
      - ./nginx/https.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    # Раз в 6 часов перечитываем конфиг, чтобы подхватить продлённый сертификат
    entrypoint:
      - /bin/sh
      - -c
      - while :; do sleep 6h; nginx -s reload; done & exec /docker-entrypoint.sh nginx -g 'daemon off;'
    depends_on:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 64M

  certbot:
    image: certbot/certbot:v2.11.0
    restart: always
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint:
      - /bin/sh
      - -c
      - trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done
    deploy:
      resources:
        limits:
          memory: 128M
